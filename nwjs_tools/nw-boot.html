<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>MixlyServer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: "Segoe UI", system-ui, sans-serif; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    .t { font-size: 22px; letter-spacing: 0.04em; }
    .s { opacity: 0.7; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="t">MixlyServer</div>
    <div class="s" id="st">正在启动本地 HTTPS 服务…</div>
  </div>
  <script>
    (function () {
      var st = document.getElementById('st');
      var httpsUrl = 'https://localhost:8443/';
      var n = 0;

      /** 跨平台：用 Chromium API 清本会话缓存（含 Cache Storage / SW），不依赖 bat */
      function clearSessionCaches(done) {
        var pending = 1;
        function step() {
          pending -= 1;
          if (pending <= 0) done();
        }
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            pending += 1;
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}).then(step);
          }
        } catch (_eSw) {}
        try {
          if (typeof caches !== 'undefined' && caches.keys) {
            pending += 1;
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}).then(step);
          }
        } catch (_eCa) {}
        try {
          if (typeof chrome !== 'undefined' && chrome.browsingData && chrome.browsingData.remove) {
            pending += 1;
            chrome.browsingData.remove(
              {},
              {
                appcache: true,
                cache: true,
                cacheStorage: true,
                serviceWorkers: true
              },
              function () { step(); }
            );
          }
        } catch (_eBd) {}
        step();
      }

      function tick() {
        n += 1;
        st.textContent = '正在启动本地 HTTPS 服务… (' + n + ')';
        fetch(httpsUrl, { mode: 'no-cors', cache: 'no-store' })
          .then(function () { location.replace(httpsUrl); })
          .catch(function () {
            if (n > 120) st.textContent = '启动超时，请检查端口 8443';
            else setTimeout(tick, 100);
          });
      }

      clearSessionCaches(function () {
        setTimeout(tick, 50);
      });
    })();
  </script>
</body>
</html>
